<!doctype html>
<html lang="he" dir="rtl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#07111f" />
  <title>ICD ISRAEL - איסוף לידים</title>
  <style>
    :root {
      --bg1: #07111f;
      --bg2: #101b31;
      --card: rgba(255,255,255,.94);
      --ink: #142033;
      --muted: #637083;
      --gold: #d7a441;
      --gold2: #f1c86b;
      --line: #dde5ef;
      --danger: #b42318;
      --ok: #0f7b4f;
      --shadow: 0 30px 90px rgba(0,0,0,.32);
      font-family: Arial, "Noto Sans Hebrew", "Rubik", sans-serif;
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body {
      min-height: 100%;
      color: var(--ink);
      background:
        radial-gradient(circle at 20% 10%, rgba(215,164,65,.28), transparent 30%),
        radial-gradient(circle at 80% 90%, rgba(80,119,180,.20), transparent 35%),
        linear-gradient(135deg, var(--bg1), var(--bg2));
      display: flex;
      align-items: center;
      justify-content: center;
      padding: clamp(14px, 2.2vw, 36px);
      overflow-x: hidden;
    }
    .shell { width: min(980px, 100%); }
    .admin-bar {
      display: none;
      justify-content: flex-start;
      gap: 10px;
      margin-bottom: 12px;
      direction: rtl;
    }
    .admin-btn {
      border: 1px solid rgba(255,255,255,.28);
      background: rgba(255,255,255,.10);
      color: rgba(255,255,255,.88);
      border-radius: 999px;
      padding: 10px 15px;
      font-size: 15px;
      cursor: pointer;
      backdrop-filter: blur(10px);
      touch-action: manipulation;
    }
    .admin-btn:active { transform: scale(.98); }
    .card {
      background: var(--card);
      border: 1px solid rgba(255,255,255,.70);
      border-radius: 34px;
      box-shadow: var(--shadow);
      overflow: hidden;
      min-height: min(760px, calc(100vh - 42px));
      display: grid;
      grid-template-columns: 1fr 1.08fr;
    }
    .hero {
      padding: clamp(28px, 4vw, 54px);
      background:
        linear-gradient(180deg, rgba(255,255,255,.08), rgba(255,255,255,0)),
        linear-gradient(145deg, #081222, #111f36 72%, #1d2d49);
      color: white;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      gap: 34px;
      position: relative;
      isolation: isolate;
    }
    .hero:before {
      content: "";
      position: absolute;
      inset: auto -90px -90px auto;
      width: 260px;
      height: 260px;
      background: radial-gradient(circle, rgba(215,164,65,.32), transparent 66%);
      z-index: -1;
    }
    .logo-wrap {
      background: rgba(255,255,255,.96);
      border-radius: 26px;
      padding: 22px;
      width: min(360px, 100%);
      box-shadow: 0 18px 45px rgba(0,0,0,.26);
    }
    .logo { display: block; width: 100%; height: auto; }
    h1 {
      margin: 0;
      font-size: clamp(34px, 5vw, 58px);
      line-height: 1.05;
      letter-spacing: -.03em;
    }
    .hero p {
      margin: 16px 0 0;
      color: rgba(255,255,255,.84);
      font-size: clamp(18px, 2.1vw, 24px);
      line-height: 1.45;
    }
    .badge {
      display: inline-flex;
      align-items: center;
      gap: 9px;
      width: fit-content;
      color: #172033;
      background: linear-gradient(135deg, var(--gold2), var(--gold));
      border-radius: 999px;
      padding: 10px 16px;
      font-weight: 700;
      font-size: 16px;
    }
    .form-side { padding: clamp(28px, 4vw, 54px); display: flex; flex-direction: column; justify-content: center; }
    .form-title { margin: 0 0 8px; font-size: clamp(28px, 3.5vw, 42px); letter-spacing: -.02em; }
    .form-sub { margin: 0 0 28px; color: var(--muted); font-size: 18px; line-height: 1.45; }
    form { display: grid; gap: 18px; }
    label { display: block; font-weight: 800; font-size: 18px; margin-bottom: 8px; }
    .optional { color: var(--muted); font-size: 15px; font-weight: 600; }
    input[type="text"], input[type="tel"], input[type="email"] {
      width: 100%;
      border: 2px solid var(--line);
      background: white;
      border-radius: 18px;
      font-size: 24px;
      padding: 20px 20px;
      min-height: 70px;
      outline: none;
      transition: border .18s, box-shadow .18s;
    }
    input:focus { border-color: var(--gold); box-shadow: 0 0 0 5px rgba(215,164,65,.16); }
    .check-row {
      display: flex;
      align-items: center;
      gap: 14px;
      background: #f6f8fb;
      border: 2px solid #edf1f6;
      border-radius: 20px;
      padding: 18px;
      user-select: none;
    }
    .check-row input { width: 32px; height: 32px; accent-color: var(--gold); flex: 0 0 auto; }
    .check-row span { font-size: 19px; font-weight: 800; }
    #emailBlock { display: none; animation: slide .18s ease-out; }
    #emailBlock.show { display: block; }
    @keyframes slide { from { opacity: 0; transform: translateY(-6px); } to { opacity: 1; transform: none; } }
    .error { min-height: 24px; color: var(--danger); font-weight: 800; font-size: 16px; }
    .save {
      border: none;
      min-height: 78px;
      border-radius: 22px;
      background: linear-gradient(135deg, var(--gold2), var(--gold));
      color: #151515;
      font-size: 28px;
      font-weight: 900;
      cursor: pointer;
      box-shadow: 0 16px 30px rgba(215,164,65,.32);
      touch-action: manipulation;
    }
    .save:active { transform: translateY(1px) scale(.995); }
    .count { display: none; }
    .thanks {
      position: fixed;
      inset: 0;
      background: rgba(7,17,31,.78);
      display: none;
      align-items: center;
      justify-content: center;
      padding: 24px;
      z-index: 20;
      backdrop-filter: blur(8px);
    }
    .thanks.show { display: flex; }
    .thanks-card {
      width: min(620px, 100%);
      background: white;
      border-radius: 34px;
      padding: clamp(38px, 6vw, 70px);
      text-align: center;
      box-shadow: var(--shadow);
    }
    .checkmark {
      width: 92px; height: 92px; border-radius: 50%;
      display: inline-grid; place-items: center;
      background: rgba(15,123,79,.12); color: var(--ok);
      font-size: 54px; font-weight: 900;
      margin-bottom: 22px;
    }
    .thanks h2 { margin: 0; font-size: clamp(34px, 5vw, 56px); }
    .thanks p { color: var(--muted); font-size: 20px; margin: 16px 0 0; }
    @media (max-width: 780px) {
      body { align-items: stretch; padding: 10px; }
      .card { grid-template-columns: 1fr; border-radius: 26px; }
      .hero { padding: 28px; gap: 20px; }
      .logo-wrap { width: min(300px, 100%); padding: 16px; }
      .form-side { padding: 28px; }
      input[type="text"], input[type="tel"], input[type="email"] { font-size: 22px; min-height: 66px; }
    }
  </style>
</head>

        <div>
          <div class="badge">ICD ISRAEL</div>
          <h1>שירותי מעבדת שיניים לרופאים</h1>
          <p>השאירו פרטים וניצור קשר להצגת השירותים, האפשרויות וההתאמה למרפאה שלכם.</p>
        </div>
      </section>

      <section class="form-side">
        <h2 class="form-title">השארת פרטים</h2>
        <p class="form-sub">מיועד לרופאי שיניים המתעניינים בשירותי מעבדת ICD ISRAEL.</p>

        <form id="leadForm" autocomplete="off" novalidate>
          <div>
            <label for="fullName">שם מלא</label>
            <input id="fullName" name="fullName" type="text" inputmode="text" required autofocus />
          </div>
          <div>
            <label for="phone">טלפון</label>
            <input id="phone" name="phone" type="tel" inputmode="tel" required />
          </div>
          <div>
            <label for="city">העיר בה ממוקמת המרפאה <span class="optional">לא חובה</span></label>
            <input id="city" name="city" type="text" inputmode="text" />
          </div>
          <label class="check-row" for="mailing">
            <input id="mailing" name="mailing" type="checkbox" />
            <span>אני מאשר קבלת מידע שיווקי ולימודי</span>
          </label>
          <div id="emailBlock">
            <label for="email">כתובת דואר אלקטרוני <span class="optional">לא חובה</span></label>
            <input id="email" name="email" type="email" inputmode="email" dir="ltr" />
          </div>
          <div id="error" class="error" role="alert"></div>
          <button class="save" type="submit">שמור</button>
        </form>
        <div class="count" id="countText">נשמרו 0 פניות במכשיר זה</div>
      </section>
    </main>
  </div>

  <div class="thanks" id="thanks" role="dialog" aria-live="assertive">
    <div class="thanks-card">
      <div class="checkmark">✓</div>
      <h2>תודה. הפרטים נשמרו</h2>
      <p>הטופס יתאפס בעוד 5 שניות ויהיה מוכן למילוי נוסף.</p>
    </div>
  </div>

<script>
(function(){
  // Google Sheets Apps Script Web App URL.
  // כרגע ריק: אחרי שתספק Web App URL, אכניס אותו כאן והלידים יעברו ישירות לשיטס ברקע.
  const GOOGLE_SHEETS_WEB_APP_URL = 'https://script.google.com/macros/s/AKfycbzSmbOgslD3wedQrkAQFSgDQdHdOEhDXzJT7WW4tHrqYDMTtyoD7V2tTQI4Hu0_5TVY/exec';
  const KEY = 'icd_israel_leads_pending_v1';
  const form = document.getElementById('leadForm');
  const mailing = document.getElementById('mailing');
  const emailBlock = document.getElementById('emailBlock');
  const error = document.getElementById('error');
  const thanks = document.getElementById('thanks');
  const countText = document.getElementById('countText');

  function getLeads(){
    try { return JSON.parse(localStorage.getItem(KEY) || '[]'); }
    catch(e){ return []; }
  }
  function setLeads(leads){ localStorage.setItem(KEY, JSON.stringify(leads)); updateCount(); }
  function updateCount(){ countText.textContent = 'נשמרו ' + getLeads().length + ' פניות במכשיר זה'; }
  function clean(v){ return String(v || '').trim(); }
  function csvEscape(v){ return '"' + String(v ?? '').replaceAll('"','""') + '"'; }
  function resetForm(){
    form.reset();
    emailBlock.classList.remove('show');
    error.textContent = '';
    document.getElementById('fullName').focus();
  }

  function savePending(lead){
    const pending = getLeads();
    pending.push(lead);
    setLeads(pending);
  }

  function sendToGoogleSheets(lead){
    if (!GOOGLE_SHEETS_WEB_APP_URL) {
      savePending(lead);
      return;
    }
    const body = new URLSearchParams();
    Object.entries(lead).forEach(([key, value]) => body.append(key, value));
    fetch(GOOGLE_SHEETS_WEB_APP_URL, {
      method: 'POST',
      mode: 'no-cors',
      headers: { 'Content-Type': 'application/x-www-form-urlencoded;charset=UTF-8' },
      body
    }).catch(() => savePending(lead));
  }

  mailing.addEventListener('change', () => {
    emailBlock.classList.toggle('show', mailing.checked);
    if (!mailing.checked) document.getElementById('email').value = '';
  });

  form.addEventListener('submit', (ev) => {
    ev.preventDefault();
    error.textContent = '';
    const lead = {
      savedAt: new Date().toISOString(),
      name: clean(document.getElementById('fullName').value),
      phone: clean(document.getElementById('phone').value),
      city: clean(document.getElementById('city').value),
      mailing: mailing.checked ? 'כן' : 'לא',
      email: mailing.checked ? clean(document.getElementById('email').value) : ''
    };
    if (!lead.name) { error.textContent = 'נא למלא שם מלא'; return; }
    if (!lead.phone) { error.textContent = 'נא למלא מספר טלפון'; return; }
    sendToGoogleSheets(lead);
    thanks.classList.add('show');
    window.setTimeout(() => {
      thanks.classList.remove('show');
      resetForm();
    }, 5000);
  });

  document.getElementById('exportBtn').addEventListener('click', () => {
    const leads = getLeads();
    if (!leads.length) { alert('אין עדיין פניות לייצוא'); return; }
    const headers = ['תאריך שמירה','שם','טלפון','עיר המרפאה','מאשר קבלת מידע שיווקי ולימודי','DO NOT SEND','אימייל'];
    const rows = leads.map(l => [
      l.savedAt,
      l.name,
      l.phone,
      l.city,
      l.mailing === 'כן' ? '+' : '',
      l.mailing === 'כן' ? '' : '+',
      l.email
    ]);
    const csv = '\ufeff' + [headers, ...rows].map(row => row.map(csvEscape).join(',')).join('\n');
    const blob = new Blob([csv], {type: 'text/csv;charset=utf-8'});
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    const stamp = new Date().toISOString().slice(0,10);
    a.href = url;
    a.download = 'icd-israel-leads-' + stamp + '.csv';
    document.body.appendChild(a);
    a.click();
    a.remove();
    URL.revokeObjectURL(url);
  });

  document.getElementById('clearBtn').addEventListener('click', () => {
    const leads = getLeads();
    if (!leads.length) { alert('אין נתונים למחיקה'); return; }
    if (confirm('למחוק את כל הפניות השמורות במכשיר הזה? מומלץ לייצא CSV לפני מחיקה.')) {
      setLeads([]);
      alert('הנתונים נמחקו מהמכשיר');
    }
  });

  updateCount();
})();
</script>
</body>
</html>
